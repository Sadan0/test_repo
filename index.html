<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #000000;
        }
        .pdf-container {
            margin-bottom: 30px;
            background: #000000;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #000000;
        }
        div {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <iframe src="AI WITH OUTPUT - AI WITH OUTPUT.pdf"></iframe>
    </div>

    <div class="pdf-container">
        <iframe src="INS_SEM5_practical_journal.pdf"></iframe>
    </div>

    <div class="pdf-container">
        <iframe src="SQAT_G_2.pdf"></iframe>
    </div>
    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                window.close();
            }
        });
    </script>

</body>
</html>
